<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Câmera HD PRO – Frontal & Traseira</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}
.stage{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}
video,canvas,img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#camera{object-fit:cover}
#camera.mirrored{transform:scaleX(-1)}
#canvasPreview{object-fit:contain;display:none;z-index:5}
#molduraImagePreview{object-fit:cover;pointer-events:none;z-index:6}

.controls{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:10;
  flex-wrap:wrap;
}
button,select{
  padding:12px 16px;
  border-radius:30px;
  border:none;
  font-size:14px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvasPreview"></canvas>
  <canvas id="canvasFinal" style="display:none"></canvas>
  <img id="molduraImagePreview" src="moldura1.png">
</div>

<div class="controls">
  <button onclick="switchCamera()">🔄 Câmera</button>

  <select id="modeSelect">
    <option value="light">🧠 Modo Leve</option>
    <option value="pro">🚀 Modo Pro</option>
  </select>

  <select id="formatSelect">
    <option value="png">PNG</option>
    <option value="jpeg">JPEG</option>
  </select>

  <button onclick="takePhoto()">📸 Foto</button>
</div>

<script>
const video = document.getElementById('camera');
const canvasFinal = document.getElementById('canvasFinal');
const canvasPreview = document.getElementById('canvasPreview');
const moldura = document.getElementById('molduraImagePreview');

const ctxFinal = canvasFinal.getContext('2d');
const ctxPreview = canvasPreview.getContext('2d');

ctxFinal.imageSmoothingEnabled = true;
ctxFinal.imageSmoothingQuality = 'high';
ctxPreview.imageSmoothingEnabled = true;
ctxPreview.imageSmoothingQuality = 'high';

let stream = null;
let usingFrontCamera = true;

// 🎥 INIT CAMERA
async function initCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode: usingFrontCamera ? 'user' : 'environment',
      width:{ideal:1920},
      height:{ideal:1080},
      frameRate:{ideal:30}
    },
    audio:false
  });

  video.srcObject = stream;
  video.setAttribute('playsinline', true);
  video.classList.toggle('mirrored', usingFrontCamera);

  video.onloadedmetadata = () => {
    video.play();
    console.log('Câmera:', usingFrontCamera?'Frontal':'Traseira',
      video.videoWidth, video.videoHeight);
  };
}
initCamera();

// 🔄 SWITCH CAMERA
async function switchCamera(){
  usingFrontCamera = !usingFrontCamera;
  await initCamera();
}

// 📸 FOTO
function takePhoto(){
  const mode = modeSelect.value;
  const format = formatSelect.value;

  canvasFinal.width = 1080;
  canvasFinal.height = 1920;
  drawVideo(ctxFinal,1080,1920);
  drawMoldura(ctxFinal,1080,1920);

  if(mode==='light'){
    canvasPreview.width = 540;
    canvasPreview.height = 960;
  }else{
    canvasPreview.width = 1080;
    canvasPreview.height = 1920;
  }
  ctxPreview.drawImage(canvasFinal,0,0,canvasPreview.width,canvasPreview.height);
  canvasPreview.style.display='block';

  const type = format==='png'?'image/png':'image/jpeg';
  const quality = format==='jpeg'?0.95:1;

  canvasFinal.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`foto_${Date.now()}.${format}`;
    a.click();
    URL.revokeObjectURL(a.href);
  },type,quality);
}

function drawVideo(ctx,w,h){
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if(!vw||!vh)return;

  ctx.clearRect(0,0,w,h);
  ctx.save();

  const vr = vw/vh;
  const cr = w/h;
  let dw,dh;

  if(vr>cr){
    dh=h; dw=h*vr;
  }else{
    dw=w; dh=w/vr;
  }

  ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh);
  ctx.restore();
}

function drawMoldura(ctx,w,h){
  if(moldura.naturalWidth===w && moldura.naturalHeight===h){
    ctx.drawImage(moldura,0,0);
  }else{
    ctx.drawImage(moldura,0,0,w,h);
  }
}
</script>

</body>
</html>
