<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Câmera Foto & Vídeo</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}
.stage{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}
video,canvas,img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#camera{object-fit:cover}
#camera.mirrored{transform:scaleX(-1)}
#canvasPreview{object-fit:contain;display:none;z-index:5;background:#000}
#molduraImagePreview{object-fit:cover;pointer-events:none;z-index:6}

.controls{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:10;
}
button{
  padding:14px 18px;
  border-radius:30px;
  border:none;
  font-size:14px;
  cursor:pointer;
}

.resultBar{
  position:absolute;
  bottom:90px;
  width:100%;
  display:none;
  justify-content:center;
  gap:12px;
  z-index:20;
}
</style>
</head>

<body>

<div class="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvasPreview"></canvas>
  <canvas id="canvasFinal" style="display:none"></canvas>
  <img id="molduraImagePreview" src="moldura1.png">
</div>

<div class="resultBar" id="resultBar">
  <button onclick="downloadFile()">📥 Baixar</button>
  <button onclick="resetCamera()">🔄 Nova</button>
</div>

<div class="controls">
  <button onclick="switchCamera()">🔄 Câmera</button>
  <button onclick="takePhoto()">📸 Foto</button>
  <button onclick="startStopVideo()">🎥 Vídeo</button>
</div>

<script>
const video = document.getElementById('camera');
const canvasFinal = document.getElementById('canvasFinal');
const canvasPreview = document.getElementById('canvasPreview');
const moldura = document.getElementById('molduraImagePreview');
const resultBar = document.getElementById('resultBar');

const ctxFinal = canvasFinal.getContext('2d');
const ctxPreview = canvasPreview.getContext('2d');

ctxFinal.imageSmoothingEnabled = true;
ctxFinal.imageSmoothingQuality = 'high';
ctxPreview.imageSmoothingEnabled = true;
ctxPreview.imageSmoothingQuality = 'high';

let stream = null;
let usingFrontCamera = true;
let lastBlob = null;
let recording = false;
let mediaRecorder;
let chunks = [];

async function initCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode: usingFrontCamera ? 'user' : 'environment',
      width:{ideal:1920},
      height:{ideal:1080},
      frameRate:{ideal:30}
    },
    audio:true
  });

  video.srcObject = stream;
  video.classList.toggle('mirrored', usingFrontCamera);
  video.setAttribute('playsinline', true);
  await video.play();
}
initCamera();

async function switchCamera(){
  usingFrontCamera = !usingFrontCamera;
  await initCamera();
}

function takePhoto(){
  video.style.display = 'none';

  canvasFinal.width = 1080;
  canvasFinal.height = 1920;
  drawVideo(ctxFinal,1080,1920);
  drawMoldura(ctxFinal,1080,1920);

  canvasPreview.width = 540;
  canvasPreview.height = 960;
  ctxPreview.drawImage(canvasFinal,0,0,540,960);
  canvasPreview.style.display = 'block';

  canvasFinal.toBlob(blob=>{
    lastBlob = blob;
    resultBar.style.display = 'flex';
  }, 'image/png');
}

function startStopVideo(){
  if(recording){
    mediaRecorder.stop();
    recording = false;
    return;
  }

  recording = true;
  chunks = [];
  video.style.display = 'none';

  canvasFinal.width = 1080;
  canvasFinal.height = 1920;

  function loop(){
    if(!recording) return;
    drawVideo(ctxFinal,1080,1920);
    drawMoldura(ctxFinal,1080,1920);
    requestAnimationFrame(loop);
  }
  loop();

  const streamCanvas = canvasFinal.captureStream(30);
  stream.getAudioTracks().forEach(t=>streamCanvas.addTrack(t));

  mediaRecorder = new MediaRecorder(streamCanvas,{mimeType:'video/webm'});
  mediaRecorder.ondataavailable=e=>chunks.push(e.data);
  mediaRecorder.onstop=()=>{
    lastBlob = new Blob(chunks,{type:'video/webm'});
    resultBar.style.display = 'flex';
  };
  mediaRecorder.start();
}

function downloadFile(){
  if(!lastBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastBlob);
  a.download = `arquivo_${Date.now()}`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function resetCamera(){
  canvasPreview.style.display = 'none';
  resultBar.style.display = 'none';
  video.style.display = 'block';
}

function drawVideo(ctx,w,h){
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if(!vw||!vh) return;

  ctx.clearRect(0,0,w,h);
  const vr = vw/vh;
  const cr = w/h;
  let dw,dh;

  if(vr > cr){
    dh = h;
    dw = h * vr;
  }else{
    dw = w;
    dh = w / vr;
  }
  ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh);
}

function drawMoldura(ctx,w,h){
  if(moldura.naturalWidth === w && moldura.naturalHeight === h){
    ctx.drawImage(moldura,0,0);
  }else{
    ctx.drawImage(moldura,0,0,w,h);
  }
}
</script>

</body>
</html>
