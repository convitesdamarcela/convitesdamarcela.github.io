<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Memórias de um Dia Especial</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<section id="capa" class="tela">
  <img src="capa.png" class="capa-img">
  <button id="btnIniciar" class="btn-principal">Aperte aqui para iniciar</button>
</section>
<section id="app" class="tela hidden">
  <div class="topo">
    <button id="btnTrocar">🔄 Trocar câmera</button>
  </div>
  <div class="camera-box">
    <video id="video" playsinline muted></video>
    <img src="moldura.png" class="moldura">
  </div>
  <div id="contador" class="contador hidden">3</div>
  <div class="acoes">
    <button id="btnFoto">📷 Foto</button>
    <button id="btnTirinha">🎞️ Tirinha</button>
  </div>
  <canvas id="canvas" class="hidden"></canvas>
  <div id="final" class="final hidden">
    <button id="btnBaixar">⬇️ Baixar</button>
    <button id="btnWhats">📤 WhatsApp</button>
    <button id="btnDrive">📁 Google Drive</button>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>
