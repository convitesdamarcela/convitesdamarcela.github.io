<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opção 2 - PWA</title>
<style>
body{margin:0;background:black;color:white;text-align:center}
video{width:100vw;height:100vh;object-fit:cover}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
button{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
padding:18px 40px;border-radius:40px;border:none;font-size:18px}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<img class="overlay" src="MOLDURA.png">
<button onclick="photo()">📸</button>
<script>
navigator.mediaDevices.getUserMedia({
 video:{width:{ideal:1080},height:{ideal:1920},aspectRatio:9/16,facingMode:'user'}
}).then(s=>video.srcObject=s);
function photo(){alert("Foto capturada (PWA)");}
</script>
</body>
</html>
