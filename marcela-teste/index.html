<script>
let stream;
let modo = '';
let fotos = [];
let recorder;
let chunks = [];
let currentImage = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

async function iniciarCamera(comAudio=false) {
  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: 1920, height: 1080 },
    audio: comAudio
  });

  video.srcObject = stream;
}

function modoFoto() {
  modo = 'foto';
  iniciarCamera(false);
  mostrarCamera();
}

function modoVideo() {
  modo = 'video';
  iniciarCamera(true);
  iniciarGravacao();
  mostrarCamera();
}

function modoTirinha() {
  modo = 'tirinha';
  fotos = [];
  iniciarCamera(false);
  mostrarCamera();
  iniciarSequenciaTirinha();
}

function mostrarCamera() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('camera').style.display = 'block';
}

function desenharComMoldura() {
  ctx.drawImage(video, 0, 0, 1080, 1920);
  const moldura = new Image();
  moldura.src = 'moldura.png';
  moldura.onload = () => {
    ctx.drawImage(moldura, 0, 0, 1080, 1920);
    currentImage = canvas.toDataURL('image/jpeg', 0.95);
  };
}

function capturarFoto() {
  desenharComMoldura();
}

async function iniciarSequenciaTirinha() {
  for (let i = 0; i < 3; i++) {
    await contagem(3);
    desenharComMoldura();
    fotos.push(currentImage);
    await delay(800);
  }
  mostrarTirinha();
}

function contagem(n) {
  return new Promise(resolve => {
    const c = document.getElementById('contagem');
    c.style.display = 'flex';
    c.innerText = n;
    const timer = setInterval(() => {
      n--;
      if (n === 0) {
        clearInterval(timer);
        c.style.display = 'none';
        resolve();
      } else {
        c.innerText = n;
      }
    }, 1000);
  });
}

function delay(ms) {
  return new Promise(res => setTimeout(res, ms));
}

function mostrarTirinha() {
  document.getElementById('camera').style.display = 'none';
  const div = document.getElementById('tirinha');
  div.innerHTML = fotos.map((f,i)=>`
    <div>
      <img src="${f}">
      <button class="btn" onclick="baixarImagem('${f}','tirinha-${i+1}.jpg')">⬇ Baixar</button>
      <button class="btn" onclick="compartilharImagem('${f}')">📲 Compartilhar</button>
    </div>
  `).join('');
  div.style.display = 'block';
}

function baixarImagem(src, nome) {
  const a = document.createElement('a');
  a.href = src;
  a.download = nome;
  a.click();
}

async function compartilharImagem(src) {
  const blob = await fetch(src).then(r=>r.blob());
  const file = new File([blob], 'memoria.jpg', { type: 'image/jpeg' });
  if (navigator.share) {
    navigator.share({ files: [file] });
  } else {
    alert('Compartilhamento não suportado');
  }
}

function iniciarGravacao() {
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = salvarVideo;
  recorder.start();
}

function pararVideo() {
  recorder.stop();
}

function salvarVideo() {
  const blob = new Blob(chunks, { type: 'video/mp4' });
  const url = URL.createObjectURL(blob);
  baixarImagem(url, 'video.mp4');
}
</script>
