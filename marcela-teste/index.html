<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opção 1 - Web</title>
<style>
body{margin:0;font-family:serif;background:#f5f1ec;text-align:center}
button{width:80%;padding:16px;margin:10px;border-radius:40px;border:none;background:#e7d7bd;font-size:18px}
video,canvas{width:100%;max-width:360px}
.wrapper{position:relative;max-width:360px;margin:auto}
#frame{position:absolute;top:0;left:0;width:100%;pointer-events:none}
</style>
</head>
<body>
<h2>Registre esse momento</h2>
<div class="wrapper">
<video id="video" autoplay playsinline></video>
<img id="frame" src="MOLDURA.png">
</div>
<button onclick="takePhoto()">📸 Foto</button>
<button onclick="startStrip()">🖼️ Tirinha</button>
<button onclick="download()">⬇️ Baixar</button>
<canvas id="canvas" width="1080" height="1920" style="display:none"></canvas>
<script>
const video=document.getElementById('video');
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>video.srcObject=s);
let img=null;
function takePhoto(){
 const c=document.getElementById('canvas');
 c.getContext('2d').drawImage(video,0,0,1080,1920);
 img=c.toDataURL();
 alert("Foto tirada");
}
function startStrip(){alert("Aqui entra tirinha 3 fotos");}
function download(){
 if(!img){alert("Nenhuma foto");return;}
 const a=document.createElement('a');
 a.href=img;a.download="foto.png";a.click();
}
</script>
</body>
</html>
