<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moldura Premium – Convites da Marcela</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 360px;
      width: 100%;
      padding: 20px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 30px;
      border: none;
      background: #f0e0c8;
      color: #000;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registre esse momento!</h1>
    <p>Clique para iniciar</p>
    <button class="btn">📷 FOTO</button>
    <button class="btn">🖼️ TIRINHA</button>
    <button class="btn">🎥 VÍDEO</button>
  </div>
</body>
</html>
