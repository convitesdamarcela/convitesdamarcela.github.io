<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Memórias – Foto · Tirinha · Vídeo</title>

<style>
/* ===== RESET / BASE ===== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#f7f3ef;font-family: "Cinzel", serif;}
.hidden{display:none}

/* ===== CORES ===== */
:root{
  --nude:#e9d8c8;
  --nude-glow:linear-gradient(145deg,#f3e6da,#e1cdbb);
  --text:#111;
  --white:#fff;
}

/* ===== LAYOUT ===== */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.bg{
  position:absolute;inset:0;
  background:#f7f3ef center/cover no-repeat;
}
.overlay{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ===== BOTÕES ===== */
.btn{
  border-radius:999px;
  padding:14px 22px;
  min-width:220px;
  background:var(--nude-glow);
  border:2px solid var(--white);
  color:var(--text);
  font-size:18px;
  display:flex;gap:10px;align-items:center;justify-content:center;
  cursor:pointer;
}
.btn.small{font-size:16px;min-width:180px;padding:12px 18px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.menu{gap:14px}

/* ===== CAMERA ===== */
.stage{position:relative;width:100%;max-width:420px;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden}
video,canvas{width:100%;height:100%;object-fit:cover}
.frame{
  position:absolute;inset:0;pointer-events:none;
  background:center/contain no-repeat;
}

/* ===== CONTROLES ===== */
.bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px;z-index:5}
.top{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;gap:10px;z-index:5}
.counter{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:96px;color:#fff;text-shadow:0 6px 20px rgba(0,0,0,.6);z-index:6
}

/* ===== RESULT ===== */
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:14px;color:#333;text-align:center;margin-top:8px}
</style>
</head>

<body>

<!-- ===== TELA 1 – CAPA ===== -->
<section id="telaCapa" class="screen">
  <div class="bg" id="bgCapa"></div>
  <div class="overlay">
    <button class="btn" id="btnIniciar">✨ Inicie Memórias</button>
  </div>
</section>

<!-- ===== TELA 2 – MENU ===== -->
<section id="telaMenu" class="screen hidden">
  <div class="bg" id="bgMenu"></div>
  <div class="overlay menu">
    <button class="btn" id="goFoto">📸 Foto</button>
    <button class="btn" id="goTirinha">🖼️ Tirinha</button>
    <button class="btn" id="goVideo">🎥 Vídeo</button>
  </div>
</section>

<!-- ===== TELA 3 – EXPERIÊNCIA ===== -->
<section id="telaExp" class="screen hidden">
  <div class="overlay" style="padding:12px">
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div class="frame" id="frame"></div>

      <div class="top">
        <button class="btn small" id="btnSwitch">🔄 Trocar câmera</button>
      </div>

      <div class="counter hidden" id="counter">3</div>

      <div class="bottom" id="controls">
        <button class="btn small" id="btnShot">📸 Tirar foto</button>
        <button class="btn small hidden" id="btnStop">⏹️ Parar</button>
      </div>
    </div>

    <div class="actions hidden" id="resultActions">
      <button class="btn small" id="btnDownload">⬇️ Baixar</button>
      <button class="btn small" id="btnWhats">📤 WhatsApp</button>
      <button class="btn small" id="btnDrive">📁 Drive</button>
    </div>
    <div class="note hidden" id="note"></div>
  </div>
</section>

<script>
/* ===== UTIL ===== */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== ASSETS ===== */
const CAPA_URL="capa.png";
const MOLDURA_URL="moldura.png";

/* ===== STATE ===== */
let stream, facing="user", mode="foto", recorder, chunks=[];
let shots=[]; // tirinha
let lastBlob=null;

/* ===== INIT CAPA ===== */
$("#bgCapa").style.backgroundImage=`url(${CAPA_URL})`;
$("#bgMenu").style.backgroundImage=`url(${CAPA_URL})`;
$("#frame").style.backgroundImage=`url(${MOLDURA_URL})`;

$("#btnIniciar").onclick=()=>{
  $("#telaCapa").classList.add("hidden");
  $("#telaMenu").classList.remove("hidden");
};

$("#goFoto").onclick=()=>startMode("foto");
$("#goTirinha").onclick=()=>startMode("tirinha");
$("#goVideo").onclick=()=>startMode("video");

/* ===== CAMERA ===== */
async function openCam(audio=false){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}},
    audio:audio
  });
  const v=$("#video");
  v.srcObject=stream;
  await v.play();
}

$("#btnSwitch").onclick=async()=>{
  facing = facing==="user"?"environment":"user";
  await openCam(mode==="video");
};

function showExp(){
  $("#telaMenu").classList.add("hidden");
  $("#telaExp").classList.remove("hidden");
  $("#resultActions").classList.add("hidden");
  $("#note").classList.add("hidden");
}

/* ===== START MODE ===== */
async function startMode(m){
  mode=m; shots=[]; lastBlob=null;
  showExp();
  await openCam(m==="video");
  $("#btnShot").textContent = m==="video" ? "🔴 Gravar" : "📸 Tirar foto";
  $("#btnShot").classList.remove("hidden");
  $("#btnStop").classList.add("hidden");
  $("#btnShot").onclick = m==="video" ? startRec : takePhoto;
}

/* ===== COMPOSIÇÃO SEM ESTICAR ===== */
function drawCover(ctx,video,w,h){
  const vr=video.videoWidth/video.videoHeight;
  const cr=w/h;
  let sw,sh,sx,sy;
  if(vr>cr){ sh=video.videoHeight; sw=sh*cr; sx=(video.videoWidth-sw)/2; sy=0;}
  else{ sw=video.videoWidth; sh=sw/cr; sx=0; sy=(video.videoHeight-sh)/2;}
  ctx.drawImage(video,sx,sy,sw,sh,0,0,w,h);
}

/* ===== FOTO ===== */
async function takePhoto(){
  if(mode==="tirinha") return runTirinha();
  const c=$("#canvas"), v=$("#video");
  c.width=1080; c.height=1920;
  const ctx=c.getContext("2d");
  drawCover(ctx,v,1080,1920);
  const frameImg=new Image(); frameImg.src=MOLDURA_URL;
  await frameImg.decode();
  ctx.drawImage(frameImg,0,0,1080,1920);
  lastBlob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
  showResult("Foto pronta!");
}

/* ===== TIRINHA (3 fotos reais) ===== */
async function runTirinha(){
  $("#btnShot").classList.add("hidden");
  for(let i=0;i<3;i++){
    await countdown();
    shots.push(await captureRaw());
    await sleep(300);
  }
  const out=$("#canvas");
  out.width=1080; out.height=1920;
  const ctx=out.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,1080,1920);
  const pad=40, gap=20;
  const cellH=(1920-pad*2-gap*2)/3;
  for(let i=0;i<3;i++){
    const img=new Image(); img.src=URL.createObjectURL(shots[i]);
    await img.decode();
    // miniatura proporcional (sem esticar)
    const ir=img.width/img.height;
    let dw=1080-pad*2, dh=cellH;
    if(ir>dw/dh) dh=dw/ir; else dw=dh*ir;
    const x=(1080-dw)/2;
    const y=pad + i*(cellH+gap) + (cellH-dh)/2;
    ctx.drawImage(img,x,y,dw,dh);
    // borda branca leve
    ctx.strokeStyle="#fff"; ctx.lineWidth=6;
    ctx.strokeRect(x,y,dw,dh);
  }
  const frameImg=new Image(); frameImg.src=MOLDURA_URL;
  await frameImg.decode();
  ctx.drawImage(frameImg,0,0,1080,1920);
  lastBlob = await new Promise(r=>out.toBlob(r,"image/jpeg",0.88));
  showResult("Tirinha pronta!");
}

/* ===== CAPTURA RAW ===== */
async function captureRaw(){
  const c=document.createElement("canvas");
  const v=$("#video");
  c.width=1080; c.height=1920;
  const ctx=c.getContext("2d");
  drawCover(ctx,v,1080,1920);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));
}

/* ===== CONTAGEM ===== */
async function countdown(){
  const el=$("#counter"); el.classList.remove("hidden");
  for(let i=3;i>0;i--){ el.textContent=i; await sleep(700); }
  el.classList.add("hidden");
}

/* ===== VÍDEO ===== */
function startRec(){
  chunks=[];
  recorder=new MediaRecorder(stream,{mimeType:"video/webm"});
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=async()=>{
    const raw=new Blob(chunks,{type:"video/webm"});
    // export com moldura no final (frame sobreposto)
    lastBlob = raw;
    showResult("Vídeo pronto!");
  };
  recorder.start();
  $("#btnShot").classList.add("hidden");
  $("#btnStop").classList.remove("hidden");
  $("#btnStop").onclick=()=>recorder.stop();
}

/* ===== RESULT ===== */
function showResult(msg){
  $("#resultActions").classList.remove("hidden");
  $("#note").textContent=msg; $("#note").classList.remove("hidden");
}

/* ===== SHARE ===== */
$("#btnDownload").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(lastBlob);
  a.download="memorias";
  a.click();
};
$("#btnWhats").onclick=()=>{
  const txt=encodeURIComponent("Oi! Essa lembrança foi feita no evento 💖");
  window.open(`https://wa.me/?text=${txt}`);
};
$("#btnDrive").onclick=()=>{
  alert("Envio via Drive: use seu formulário/fluxo padrão.");
};
</script>
</body>
</html>
