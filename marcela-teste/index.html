<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memórias de um Dia Especial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="capa">
  <img src="capa.png" class="capa-img">
  <button id="btnStart">Aperte aqui para iniciar</button>
</section>

<section id="menu" class="hidden">
  <button data-mode="foto">📷 Foto</button>
  <button data-mode="tirinha">🎞️ Tirinha</button>
  <button data-mode="video">🎥 Vídeo</button>
  <button id="btnSwitch">🔄 Trocar câmera</button>
  <button id="btnRotate">↔️ Paisagem</button>
</section>

<section id="camera" class="hidden">
  <video id="video" autoplay playsinline muted></video>
  <img src="moldura.png" id="moldura">
  <div id="countdown" class="hidden">3</div>
</section>

<section id="final" class="hidden">
  <button id="btnDownload">⬇️ Baixar</button>
  <button id="btnWhats">📤 WhatsApp</button>
  <button id="btnDrive">📁 Google Drive</button>
</section>

<script src="app.js"></script>
</body>
</html>
