<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moldura Premium | Convites da Marcela</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Cinzel', serif;
  background:#fff;
  text-align:center;
}
.hidden{display:none}

#telaInicial{
  padding:30px;
}

.botao{
  background:#ead9c3;
  border:2px solid #fff;
  border-radius:40px;
  padding:14px 22px;
  margin:10px auto;
  width:220px;
  font-size:16px;
  cursor:pointer;
}

#cameraArea{
  position:relative;
  width:100%;
  max-width:420px;
  margin:auto;
}

video, canvas{
  width:100%;
  height:auto;
}

#moldura{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  pointer-events:none;
}

#contador{
  position:absolute;
  top:45%;
  left:0;
  right:0;
  font-size:80px;
  color:#fff;
  display:none;
}

#acoes .botao{
  width:180px;
  font-size:14px;
}
</style>
</head>

<body>

<!-- TELA 1 -->
<div id="telaInicial">
  <h2>Registre esse momento!</h2>
  <p>Clique para iniciar</p>

  <button class="botao" onclick="iniciar('foto')">📸 FOTO</button>
  <button class="botao" onclick="iniciar('tirinha')">🖼️ TIRINHA</button>
  <button class="botao" onclick="iniciar('video')">🎥 VÍDEO</button>
</div>

<!-- TELA 2 -->
<div id="cameraArea" class="hidden">
  <video id="video" autoplay playsinline></video>
  <img id="moldura" src="moldura.png" />
  <div id="contador">3</div>
</div>

<!-- BOTÕES -->
<div id="acoes" class="hidden">
  <button class="botao" onclick="capturar()">Tirar Foto</button>
  <button class="botao" onclick="trocarCamera()">Trocar Câmera</button>
  <button class="botao" onclick="parar()">Parar</button>
  <button class="botao" onclick="baixar()">Baixar</button>
  <button class="botao" onclick="whatsapp()">WhatsApp</button>
  <button class="botao" onclick="drive()">Drive</button>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
let stream, modo, camera='user', fotos=[];

async function iniciar(tipo){
  modo=tipo;
  document.getElementById('telaInicial').classList.add('hidden');
  document.getElementById('cameraArea').classList.remove('hidden');
  document.getElementById('acoes').classList.remove('hidden');

  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:camera}
  });
  video.srcObject = stream;

  if(modo==='tirinha') iniciarTirinha();
}

function trocarCamera(){
  camera = camera==='user'?'environment':'user';
  parar();
  iniciar(modo);
}

function parar(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  location.reload();
}

function iniciarTirinha(){
  fotos=[];
  let c=3;
  const contador=document.getElementById('contador');
  contador.style.display='block';

  const intervalo=setInterval(()=>{
    contador.innerText=c;
    c--;
    if(c<0){
      capturar();
      contador.style.display='none';
      clearInterval(intervalo);
    }
  },1000);
}

function capturar(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);

  if(modo==='tirinha'){
    fotos.push(canvas.toDataURL());
    if(fotos.length<3) iniciarTirinha();
    else montarTirinha();
  }
}

function montarTirinha(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=1080;
  canvas.height=1920;

  fotos.forEach((f,i)=>{
    const img=new Image();
    img.src=f;
    img.onload=()=>{
      ctx.drawImage(img,0,i*640,1080,640);
    }
  });
}

function baixar(){
  const canvas=document.getElementById('canvas');
  const link=document.createElement('a');
  link.download='memoria.png';
  link.href=canvas.toDataURL();
  link.click();
}

function whatsapp(){
  alert('Envio via WhatsApp depende do compartilhamento do navegador.');
}

function drive(){
  alert('Envio ao Drive pode ser integrado via API (versão premium).');
}
</script>

</body>
</html>
