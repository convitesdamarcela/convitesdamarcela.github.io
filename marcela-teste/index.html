<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memórias</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cinzel,serif}
body{background:#000;overflow:hidden}

.tela{
  position:fixed;
  inset:0;
  display:none;
}
.tela.ativa{display:flex}

#capa{
  background:url('capa.png') center/cover no-repeat;
  align-items:center;
  justify-content:center;
}

.botao{
  background:linear-gradient(145deg,#f4e6d3,#e7cfaa);
  border:2px solid #fff;
  border-radius:30px;
  padding:12px 20px;
  margin:8px;
  font-size:14px;
  color:#000;
}

#menu{
  position:absolute;
  bottom:160px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

video,canvas{
  width:100vw;
  height:100vh;
  object-fit:cover;
}

#contagem{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:110px;
  color:white;
  background:rgba(0,0,0,.5);
}

#controles{
  position:absolute;
  bottom:90px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

#tirinhas{
  background:#000;
  flex-direction:column;
  overflow:auto;
  padding:10px;
}
#tirinhas img{
  width:100%;
  margin-bottom:10px;
  border:4px solid white;
}
</style>
</head>

<body>

<!-- TELA 1 -->
<div id="telaCapa" class="tela ativa">
  <button class="botao" onclick="abrirMenu()">Inicie Memórias</button>
</div>

<!-- TELA 2 -->
<div id="telaMenu" class="tela">
  <div id="menu">
    <button class="botao" onclick="modoFoto()">📷 Foto</button>
    <button class="botao" onclick="modoTirinha()">🎞️ Tirinha</button>
    <button class="botao" onclick="modoVideo()">🎥 Vídeo</button>
  </div>
</div>

<!-- TELA CÂMERA -->
<div id="telaCamera" class="tela">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" width="1080" height="1920" style="display:none"></canvas>

  <div id="contagem"></div>

  <div id="controles">
    <button class="botao" onclick="capturar()">Capturar</button>
    <button class="botao" onclick="voltar()">Voltar</button>
  </div>
</div>

<!-- TELA TIRINHA -->
<div id="tirinhas" class="tela"></div>

<script>
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let ctx=canvas.getContext('2d');
let stream;
let modo='';
let fotos=[];

function trocar(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}

function abrirMenu(){ trocar('telaMenu'); }

async function iniciarCamera(audio){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user',width:1080,height:1920},
    audio:audio
  });
  video.srcObject=stream;
  trocar('telaCamera');
}

function modoFoto(){ modo='foto'; iniciarCamera(false); }
function modoVideo(){ modo='video'; iniciarCamera(true); }
function modoTirinha(){
  modo='tirinha';
  fotos=[];
  iniciarCamera(false);
  iniciarContagem();
}

function desenhar(){
  ctx.drawImage(video,0,0,1080,1920);
  let m=new Image();
  m.src='moldura.png';
  m.onload=()=>ctx.drawImage(m,0,0,1080,1920);
}

function capturar(){
  desenhar();
  let img=canvas.toDataURL('image/jpeg',0.95);
  baixar(img);
}

function baixar(src){
  let a=document.createElement('a');
  a.href=src;
  a.download='memoria.jpg';
  a.click();
}

function compartilhar(src){
  fetch(src).then(r=>r.blob()).then(b=>{
    let f=new File([b],'memoria.jpg',{type:'image/jpeg'});
    navigator.share({files:[f]});
  });
}

function voltar(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  trocar('telaMenu');
}

async function iniciarContagem(){
  let c=document.getElementById('contagem');
  for(let i=3;i>0;i--){
    c.innerText=i;
    c.style.display='flex';
    await esperar(1000);
  }
  c.style.display='none';

  for(let i=0;i<3;i++){
    desenhar();
    fotos.push(canvas.toDataURL('image/jpeg',0.95));
    await esperar(800);
  }
  mostrarTirinhas();
}

function mostrarTirinhas(){
  trocar('tirinhas');
  let t=document.getElementById('tirinhas');
  t.innerHTML='';
  fotos.forEach((f,i)=>{
    let img=document.createElement('img');
    img.src=f;
    t.appendChild(img);

    let b1=document.createElement('button');
    b1.className='botao';
    b1.innerText='⬇️ Baixar';
    b1.onclick=()=>baixar(f);

    let b2=document.createElement('button');
    b2.className='botao';
    b2.innerText='📤 Compartilhar';
    b2.onclick=()=>compartilhar(f);

    t.appendChild(b1);
    t.appendChild(b2);
  });
}

function esperar(ms){return new Promise(r=>setTimeout(r,ms));}
</script>

</body>
</html>
