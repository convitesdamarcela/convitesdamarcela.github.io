<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moldura</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="capa">
<button id="startBtn">Aperte aqui para iniciar</button>
</div>

<div id="cameraApp" class="hidden">
<video id="video" autoplay playsinline></video>
<img src="moldura.png" id="moldura">
<div id="countdown" class="hidden"></div>

<div class="controls">
<button onclick="switchCamera()">Trocar câmera</button>
<button onclick="takePhoto()">Foto</button>
<button onclick="takeStrip()">Tirinha</button>
<button onclick="recordVideo()">Vídeo</button>
<button onclick="toggleOrientation()">Paisagem</button>
</div>
</div>

<canvas id="canvas" class="hidden"></canvas>
<script src="app.js"></script>
</body>
</html>
