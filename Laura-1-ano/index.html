<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Câmera HD PRO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}
.stage{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}
video,canvas,img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#camera{object-fit:cover}
#camera.mirrored{transform:scaleX(-1)}
#canvasPreview{object-fit:contain;display:none;z-index:5}
#molduraImagePreview{object-fit:cover;pointer-events:none;z-index:6}

.controls{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:10;
  flex-wrap:wrap;
}
button,select{
  padding:12px 18px;
  border-radius:30px;
  border:none;
  font-size:14px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvasPreview"></canvas>
  <canvas id="canvasFinal" style="display:none"></canvas>
  <img id="molduraImagePreview" src="moldura1.png">
</div>

<div class="controls">
  <select id="modeSelect">
    <option value="light">🧠 Modo Leve</option>
    <option value="pro">🚀 Modo Pro</option>
  </select>

  <select id="formatSelect">
    <option value="png">PNG (Alta Qualidade)</option>
    <option value="jpeg">JPEG (Mais leve)</option>
  </select>

  <button onclick="takePhoto()">📸 Foto</button>
  <button onclick="startStopVideo()">🎥 Vídeo</button>
</div>

<script>
const video = document.getElementById('camera');
const canvasFinal = document.getElementById('canvasFinal');
const canvasPreview = document.getElementById('canvasPreview');
const moldura = document.getElementById('molduraImagePreview');

const ctxFinal = canvasFinal.getContext('2d');
const ctxPreview = canvasPreview.getContext('2d');

ctxFinal.imageSmoothingEnabled = true;
ctxFinal.imageSmoothingQuality = 'high';
ctxPreview.imageSmoothingEnabled = true;
ctxPreview.imageSmoothingQuality = 'high';

let usingFrontCamera = true;
let stream;
let mediaRecorder;
let chunks = [];
let recording = false;

async function initCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:usingFrontCamera?'user':'environment',
      width:{ideal:1920},
      height:{ideal:1080}
    },
    audio:true
  });
  video.srcObject = stream;
  video.classList.toggle('mirrored',usingFrontCamera);
}
initCamera();

function takePhoto(){
  const mode = modeSelect.value;
  const format = formatSelect.value;

  canvasFinal.width = 1080;
  canvasFinal.height = 1920;
  drawVideo(ctxFinal,1080,1920,true);
  drawMoldura(ctxFinal,1080,1920);

  if(mode==='light'){
    canvasPreview.width = 540;
    canvasPreview.height = 960;
  }else{
    canvasPreview.width = 1080;
    canvasPreview.height = 1920;
  }
  ctxPreview.drawImage(canvasFinal,0,0,canvasPreview.width,canvasPreview.height);
  canvasPreview.style.display='block';

  const type = format==='png'?'image/png':'image/jpeg';
  const quality = format==='jpeg'?0.95:1;

  canvasFinal.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`foto_${Date.now()}.${format}`;
    a.click();
    URL.revokeObjectURL(a.href);
  },type,quality);
}

function startStopVideo(){
  if(recording){
    mediaRecorder.stop();
    recording=false;
    return;
  }

  recording=true;
  chunks=[];

  canvasFinal.width = 1080;
  canvasFinal.height = 1920;

  function loop(){
    if(!recording)return;
    drawVideo(ctxFinal,1080,1920,true);
    drawMoldura(ctxFinal,1080,1920);
    requestAnimationFrame(loop);
  }
  loop();

  const streamCanvas = canvasFinal.captureStream(30);
  stream.getAudioTracks().forEach(t=>streamCanvas.addTrack(t));

  mediaRecorder = new MediaRecorder(streamCanvas,{mimeType:'video/webm'});
  mediaRecorder.ondataavailable=e=>chunks.push(e.data);
  mediaRecorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`video_${Date.now()}.webm`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  mediaRecorder.start();
}

function drawVideo(ctx,w,h,mirror){
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.translate(w/2,h/2);
  if(usingFrontCamera&&mirror)ctx.scale(-1,1);

  const vr=vw/vh,cr=w/h;
  let dw,dh;
  if(vr>cr){dh=h;dw=h*vr}else{dw=w;dh=w/vr}
  ctx.drawImage(video,-dw/2,-dh/2,dw,dh);
  ctx.restore();
}

function drawMoldura(ctx,w,h){
  if(moldura.naturalWidth)
    ctx.drawImage(moldura,0,0,w,h);
}
</script>

</body>
</html>
