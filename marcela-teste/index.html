<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Inicie Memórias</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap');

* {
  box-sizing: border-box;
  font-family: 'Cinzel', serif;
}

body {
  margin: 0;
  background: #ffffff;
  overflow: hidden;
}

.hidden { display: none; }

button {
  border-radius: 999px;
  border: 2px solid #fff;
  background: linear-gradient(135deg,#f3e1c9,#e8d2b0);
  color: #000;
  padding: 14px 22px;
  font-size: 16px;
  margin: 8px;
  cursor: pointer;
}

#home {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

#cameraView {
  position: fixed;
  inset: 0;
  background: #000;
}

video, canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#frame {
  position: absolute;
  inset: 0;
  background: url("MOLDURA.png") center/contain no-repeat;
  pointer-events: none;
}

#controls {
  position: absolute;
  bottom: 90px;
  width: 100%;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#actions {
  position: absolute;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

#countdown {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 80px;
  color: white;
  background: rgba(0,0,0,0.4);
  z-index: 10;
}
</style>
</head>

<body>

<!-- TELA 1 -->
<div id="home">
  <h2>Registre esse momento!</h2>
  <p>Clique para iniciar</p>

  <button onclick="start('photo')">📸 FOTO</button>
  <button onclick="startStrip()">🖼️ TIRINHA</button>
  <button onclick="start('video')">🎥 VÍDEO</button>
</div>

<!-- CAMERA -->
<div id="cameraView" class="hidden">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="frame"></div>

  <div id="countdown" class="hidden"></div>

  <div id="controls">
    <button onclick="capture()">Tirar Foto</button>
    <button onclick="switchCamera()">Trocar Câmera</button>
    <button onclick="stopVideo()">Parar</button>
  </div>

  <div id="actions" class="hidden">
    <button onclick="download()">⬇️ Baixar</button>
    <button onclick="share()">📤 WhatsApp</button>
  </div>
</div>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let stream;
let mode = "photo";
let facing = "user";
let stripPhotos = [];
let mediaRecorder;
let chunks = [];

async function start(type){
  mode = type;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("cameraView").classList.remove("hidden");

  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode: facing },
    audio: type === "video"
  });

  video.srcObject = stream;

  if(type === "video"){
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.start();
  }
}

function switchCamera(){
  facing = facing === "user" ? "environment" : "user";
  stopStream();
  start(mode);
}

function stopStream(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
}

function capture(){
  if(mode === "photo"){
    drawFrame();
  }
}

function drawFrame(){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  document.getElementById("actions").classList.remove("hidden");
}

function startStrip(){
  mode="strip";
  stripPhotos=[];
  start("photo");
  countdownStrip();
}

function countdownStrip(){
  let c = 3;
  let cd = document.getElementById("countdown");
  cd.classList.remove("hidden");
  cd.innerText = c;

  let interval = setInterval(()=>{
    c--;
    if(c===0){
      captureStrip();
      cd.classList.add("hidden");
      clearInterval(interval);
    } else {
      cd.innerText = c;
    }
  },1000);
}

function captureStrip(){
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  stripPhotos.push(canvas.toDataURL());

  if(stripPhotos.length < 3){
    countdownStrip();
  } else {
    buildStrip();
  }
}

function buildStrip(){
  let img = new Image();
  img.onload = ()=>{
    canvas.width = img.width;
    canvas.height = img.height*3;
    stripPhotos.forEach((src,i)=>{
      let im = new Image();
      im.onload = ()=>ctx.drawImage(im,0,i*img.height,img.width,img.height);
      im.src = src;
    });
    document.getElementById("actions").classList.remove("hidden");
  };
  img.src = stripPhotos[0];
}

function stopVideo(){
  if(mediaRecorder){
    mediaRecorder.stop();
    mediaRecorder.onstop = ()=>{
      let blob = new Blob(chunks,{type:"video/webm"});
      let url = URL.createObjectURL(blob);
      download(url,"video.webm");
    };
  }
}

function download(url){
  let a = document.createElement("a");
  a.href = url || canvas.toDataURL("image/png");
  a.download = "memoria.png";
  a.click();
}

function share(){
  if(navigator.share){
    canvas.toBlob(blob=>{
      navigator.share({
        files:[new File([blob],"memoria.png",{type:"image/png"})]
      });
    });
  }
}
</script>

</body>
</html>
