<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memórias de um Dia Especial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="capa">
  <img src="capa.png" class="capa-img">
  <button id="btnIniciar">Aperte aqui para iniciar</button>
</section>

<section id="app" class="hidden">
  <video id="video" autoplay playsinline muted></video>
  <img src="moldura.png" class="moldura">
  <div class="controls">
    <button id="btnTrocar">Trocar câmera</button>
    <button id="btnFoto">Foto</button>
    <button id="btnTirinha">Tirinha</button>
    <button id="btnVideo">Vídeo</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
