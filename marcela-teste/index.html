<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Memórias de um Dia Especial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="capa">
  <img src="capa.png" class="capa-img">
  <button id="btnStart">Aperte aqui para iniciar</button>
</section>

<section id="app" class="hidden">
  <div id="cameraArea">
    <video id="video" autoplay playsinline muted></video>
    <img src="moldura.png" id="moldura">
    <div id="countdown" class="hidden">3</div>
    <div id="rec" class="hidden">● REC</div>
  </div>

  <div class="controls">
    <button onclick="switchCamera()">🔄 Câmera</button>
    <button onclick="toggleOrientation()">↔️ Paisagem</button>
    <button onclick="takePhoto()">📷 Foto</button>
    <button onclick="takeStrip()">🎞️ Tirinha</button>
    <button onclick="recordVideo()">🎥 Vídeo</button>
  </div>

  <div id="after" class="hidden">
    <button onclick="downloadResult()">⬇️ Baixar</button>
    <button onclick="sendWhats()">📤 WhatsApp</button>
    <button onclick="sendDrive()">📁 Drive</button>
  </div>
</section>

<canvas id="canvas" class="hidden"></canvas>
<script src="app.js"></script>
</body>
</html>
