<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Camera Booth FINAL</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}
.stage{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}
video,canvas,img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#camera{
  object-fit:cover;
  z-index:1;
}
#camera.hidden{
  display:none;
}
#moldura{
  object-fit:cover;
  pointer-events:none;
  z-index:2;
}
.controls{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:10;
}
button{
  padding:14px 18px;
  border-radius:30px;
  border:none;
  font-size:14px;
}
.result{
  position:absolute;
  bottom:90px;
  width:100%;
  display:none;
  justify-content:center;
  gap:12px;
  z-index:20;
}
</style>
</head>

<body>

<div class="stage">
  <video id="camera" autoplay playsinline muted></video>
  <img id="moldura" src="moldura1.png">
</div>

<div class="result" id="result">
  <button id="downloadBtn">📥 Baixar</button>
  <button id="newBtn">🔄 Nova</button>
</div>

<div class="controls">
  <button id="switchBtn">🔄 Câmera</button>
  <button id="photoBtn">📸 Foto</button>
  <button id="videoBtn">🎥 Vídeo</button>
</div>

<script>
const video = document.getElementById('camera');
const moldura = document.getElementById('moldura');
const result = document.getElementById('result');

let stream = null;
let usingFront = true;
let lastBlob = null;

// ===== CAMERA =====
async function startCamera(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode: usingFront ? 'user' : 'environment' },
    audio:true
  });

  video.srcObject = stream;
  video.style.display = 'block';
  await video.play();
}

// ===== SWITCH =====
document.getElementById('switchBtn').onclick = async ()=>{
  usingFront = !usingFront;
  await startCamera();
};

// ===== FOTO =====
document.getElementById('photoBtn').onclick = async ()=>{
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const vr = vw/vh;
  const cr = 1080/1920;
  let dw,dh;

  if(vr>cr){ dh=1920; dw=1920*vr; }
  else{ dw=1080; dh=1080/vr; }

  ctx.drawImage(video,(1080-dw)/2,(1920-dh)/2,dw,dh);
  ctx.drawImage(moldura,0,0,1080,1920);

  canvas.toBlob(b=>{
    lastBlob = b;
    result.style.display='flex';
  },'image/png');
};

// ===== VIDEO =====
let recorder, chunks=[], recording=false;

document.getElementById('videoBtn').onclick = ()=>{
  if(recording){
    recording=false;
    recorder.stop();
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  recording=true;
  chunks=[];

  function loop(){
    if(!recording) return;

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const vr = vw/vh;
    const cr = 1080/1920;
    let dw,dh;

    if(vr>cr){ dh=1920; dw=1920*vr; }
    else{ dw=1080; dh=1080/vr; }

    ctx.clearRect(0,0,1080,1920);
    ctx.drawImage(video,(1080-dw)/2,(1920-dh)/2,dw,dh);
    ctx.drawImage(moldura,0,0,1080,1920);

    requestAnimationFrame(loop);
  }
  loop();

  const cStream = canvas.captureStream(30);
  stream.getAudioTracks().forEach(t=>cStream.addTrack(t));

  recorder = new MediaRecorder(cStream,{mimeType:'video/webm'});
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    lastBlob = new Blob(chunks,{type:'video/webm'});
    result.style.display='flex';
  };
  recorder.start();
};

// ===== DOWNLOAD / RESET =====
document.getElementById('downloadBtn').onclick=()=>{
  if(!lastBlob) return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(lastBlob);
  a.download='arquivo_'+Date.now();
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById('newBtn').onclick=()=>{
  result.style.display='none';
  lastBlob=null;
};

// START
startCamera();
</script>

</body>
</html>
