<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Convites da Marcela</title>

  <style>
    :root {
      --lilas: #9d8bc0;
      --lilas-claro: #e9e3f3;
      --roxo: #682cbf;
      --branco: #ffffff;
      --texto: #2b2b2b;
    }

    * {
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--lilas-claro);
      background-image: url("assets/watermark.png");
      background-repeat: repeat;
      background-size: 180px;
      background-opacity: 0.05;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: var(--branco);
      width: 100%;
      max-width: 420px;
      padding: 30px 22px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      width: 140px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: 26px;
      color: var(--texto);
    }

    .sub {
      font-size: 14px;
      color: #666;
      margin-bottom: 22px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border-radius: 40px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn.primary {
      background: linear-gradient(90deg, var(--roxo), var(--lilas));
      color: white;
    }

    .btn.secondary {
      background: white;
      color: var(--roxo);
      border: 2px solid var(--lilas);
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGO -->
  <img src="assets/logo.png" alt="Convites da Marcela" class="logo">


    <h1>Convites da Marcela</h1>
    <p class="sub">Um convite, mil lembranças ✨</p>

    <!-- BOTÕES -->
    <a href="#" class="btn primary">🎈 Convites Infantis</a>
    <a href="#" class="btn primary">👑 Convites 15 Anos</a>

    <a href="#" class="btn secondary">🖼️ Moldura de Fotos</a>
    <a href="#" class="btn secondary">🎞️ Retrospectiva</a>
    <a href="#" class="btn secondary">🎵 Música Personalizada</a>
    <a href="#" class="btn secondary">🧸 Mascotinhos</a>

  </div>
</body>
</html>
